name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像自带 Android SDK，直接用预装版本，避免第三方 action 失效
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK at $SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Build debug APK
        if: success()
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a gradle-build.log

      # 失败时把构建日志推到 ci-log 分支，便于在仓库外直接读取编译错误
      - name: Publish build log
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f gradle-build.log
          git commit -m "ci: build failure log" || true
          git push -f origin ci-log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livetv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # 打 v* 标签时自动创建 GitHub Release 并附上 APK
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: livetv-debug-apk
          path: dist

      - name: Rename and gather info
        shell: bash
        run: |
          cd dist
          for f in *.apk; do mv "$f" "LiveTV-${GITHUB_REF_NAME}-debug.apk"; done
          ls -lh
          echo "BUILD_DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z')" >> "$GITHUB_ENV"
          echo "APK_NAME=$(ls *.apk | head -n1)" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h *.apk | cut -f1)" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: 电视直播 ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 电视直播 ${{ github.ref_name }}

            | 项目 | 内容 |
            |---|---|
            | 构建时间 | ${{ env.BUILD_DATE }} |
            | 文件 | `${{ env.APK_NAME }}`（${{ env.APK_SIZE }}） |
            | 最低系统 | Android 6.0（API 23） |
            | 频道数 | 441 个（央视 / 卫视 / 地方 / 电影 / 纪录） |
            | 签名 | debug 签名，可直接覆盖安装同签名旧版 |

            ### 安装

            - U 盘：拷入 APK → 电视「我的应用」或「媒体中心」→ 打开安装
            - adb：`adb install ${{ env.APK_NAME }}`

            ### 说明

            首次打开即加载内置的 441 个频道，断网也能播；设置 -「订阅源」-「恢复默认源」会联网拉取最新列表。
