<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电视直播</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>电视直播</h1>
    <span class="badge" id="sourceBadge">加载中</span>
  </div>
  <div class="actions">
    <button id="sourceBtn" class="btn ghost">订阅源</button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">分组</div>
    <ul id="groupList" class="group-list"></ul>
  </aside>

  <section class="content">
    <div class="content-head">
      <h2 id="groupTitle">全部频道</h2>
      <span class="count" id="channelCount"></span>
    </div>
    <div id="channelGrid" class="grid"></div>
    <div id="emptyState" class="empty hidden"></div>
  </section>
</main>

<!-- 播放层 -->
<div id="playerLayer" class="player hidden">
  <video id="video" playsinline controls></video>
  <div id="playerError" class="player-error hidden">
    <div class="player-error-card">
      <div class="player-error-title">这个台暂时播不了</div>
      <p id="playerErrorText" class="player-error-text"></p>
      <div class="player-error-actions">
        <button id="nextChannelBtn" class="btn primary small">下一个频道</button>
        <button id="retryBtn" class="btn ghost small">重试</button>
        <button id="closePlayerBtn2" class="btn ghost small">关闭</button>
      </div>
    </div>
  </div>
  <div class="player-bar">
    <div class="player-title">
      <strong id="playerName"></strong>
      <span id="playerStatus" class="status"></span>
    </div>
    <div class="player-actions">
      <button id="fullscreenBtn" class="btn ghost small">网页全屏</button>
      <button id="closePlayerBtn" class="btn ghost small">关闭</button>
    </div>
  </div>
</div>

<!-- 订阅源弹窗 -->
<div id="sourceModal" class="modal hidden">
  <div class="modal-card">
    <h3>订阅源</h3>
    <p class="hint">支持 m3u / txt 格式，需以 http:// 或 https:// 开头。</p>
    <input id="sourceInput" type="text" spellcheck="false" placeholder="https://example.com/tv.m3u">
    <p id="sourceError" class="error-text"></p>
    <div class="modal-actions">
      <button id="resetSourceBtn" class="btn danger">恢复默认源</button>
      <span class="spacer"></span>
      <button id="cancelSourceBtn" class="btn ghost">取消</button>
      <button id="saveSourceBtn" class="btn primary">保存并切换</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/vendor/hls.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
